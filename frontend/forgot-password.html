<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - FinverseAI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <div class="brand-icon">
            <i class="fa-solid fa-chart-line"></i>
          </div>
          <span class="brand-name">Finverse<span>AI</span></span>
        </a>
        <h1>Reset Password</h1>
        <p>Enter your registered email and we'll send you instructions to reset your password.</p>
      </div>

      <form id="forgotPasswordForm" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="forgotEmail">Email Address <span class="req">*</span></label>
          <input 
            type="email" 
            id="forgotEmail" 
            class="form-control" 
            placeholder="e.g. aarav.sharma@example.com" 
            value="aarav.sharma@finverse.ai"
            required
          >
          <span class="form-error">Please enter a valid email</span>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          <i class="fa-regular fa-paper-plane"></i> Send Reset Link
        </button>
      </form>

      <div class="auth-footer">
        Remembered your password? <a href="login.html">Back to Login</a>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
