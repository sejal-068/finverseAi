<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FinverseAI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <div class="finverse-logo-mark logo-lg">
            <div class="logo-circle c1"></div>
            <div class="logo-circle c2"></div>
            <div class="logo-circle c3"></div>
            <div class="logo-circle c4"></div>
            <div class="logo-sparkle"></div>
          </div>
          <span class="brand-name finverse-brand">Finverse<span class="ai-suffix">AI</span></span>
        </a>
        <h1>Welcome Back</h1>
        <p>Log in to access your financial insights and AI advisor</p>
      </div>

      <button type="button" class="btn-social" id="googleLoginBtn">
        <i class="fa-brands fa-google text-danger"></i>
        <span>Continue with Google</span>
      </button>

      <div class="auth-divider">
        <span>OR LOGIN WITH EMAIL</span>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address <span class="req">*</span></label>
          <input 
            type="email" 
            id="loginEmail" 
            class="form-control" 
            placeholder="e.g. yourname@example.com" 
            autocomplete="email"
            required
          >
          <span class="form-error">Please enter a valid email</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password <span class="req">*</span></label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="loginPassword" 
              class="form-control" 
              placeholder="Enter your account password" 
              autocomplete="current-password"
              required
            >
            <button type="button" class="password-toggle-btn" data-target="loginPassword" title="Show/Hide password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <span class="form-error">Password is required</span>
        </div>

        <div class="auth-links">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-secondary);">
            <input type="checkbox" id="rememberMe" checked style="accent-color: var(--primary);">
            <span>Remember me</span>
          </label>
          <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Create an Account</a>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
